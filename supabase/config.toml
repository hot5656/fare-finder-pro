project_id = "luugfvsrawnuzwpjvddt"

[api]
schemas = ["public", "flight", "graphql_public"]
[functions.flight-parser]
enabled = true
verify_jwt = true
import_map = "./functions/flight-parser/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/flight-parser/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/flight-parser/*.html" ]

[functions.flight-notification]
enabled = true
verify_jwt = true
import_map = "./functions/flight-notification/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/flight-notification/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/flight-notification/*.html" ]

# M2: called by the signed-in user with their own JWT.
[functions.flight-subscribe]
enabled = true
verify_jwt = true
import_map = "./functions/flight-subscribe/deno.json"
entrypoint = "./functions/flight-subscribe/index.ts"

# M2: called by the signed-in user with their own JWT.
[functions.flight-cancel-subscription]
enabled = true
verify_jwt = true
import_map = "./functions/flight-cancel-subscription/deno.json"
entrypoint = "./functions/flight-cancel-subscription/index.ts"

# Admin: called by an admin user with their own JWT; checked against flight.admins inside.
[functions.flight-admin-notify]
enabled = true
verify_jwt = true
import_map = "./functions/flight-admin-notify/deno.json"
entrypoint = "./functions/flight-admin-notify/index.ts"

# Admin: called by an admin user with their own JWT; checked against flight.admins inside.
[functions.flight-admin-expire]
enabled = true
verify_jwt = true
import_map = "./functions/flight-admin-expire/deno.json"
entrypoint = "./functions/flight-admin-expire/index.ts"

# Admin: called by an admin user with their own JWT; checked against flight.admins inside.
[functions.flight-admin-settings]
enabled = true
verify_jwt = true
import_map = "./functions/flight-admin-settings/deno.json"
entrypoint = "./functions/flight-admin-settings/index.ts"

# Admin: called by an admin user with their own JWT; checked against flight.admins inside.
[functions.flight-admin-routes]
enabled = true
verify_jwt = true
import_map = "./functions/flight-admin-routes/deno.json"
entrypoint = "./functions/flight-admin-routes/index.ts"

# M2: service-role bearer only (checked inside the function).
[functions.flight-status-notification]
enabled = true
verify_jwt = true
import_map = "./functions/flight-status-notification/deno.json"
entrypoint = "./functions/flight-status-notification/index.ts"

# M2: called by ECPay servers, which send no JWT. CheckMacValue is the auth.
[functions.flight-ecpay-return]
enabled = true
verify_jwt = false
import_map = "./functions/flight-ecpay-return/deno.json"
entrypoint = "./functions/flight-ecpay-return/index.ts"

# M2: called by ECPay servers, which send no JWT. CheckMacValue is the auth.
[functions.flight-ecpay-period]
enabled = true
verify_jwt = false
import_map = "./functions/flight-ecpay-period/deno.json"
entrypoint = "./functions/flight-ecpay-period/index.ts"

# M2: ECPay redirects the user's browser here with a POST; no JWT.
[functions.flight-ecpay-result]
enabled = true
verify_jwt = false
import_map = "./functions/flight-ecpay-result/deno.json"
entrypoint = "./functions/flight-ecpay-result/index.ts"
